<title>Lean IT Foundation — Guía de estudio</title>
<style>
  :root{
    --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#E3E6DE; --surface-3:#D9DCD2;
    --ink:#1A2420; --ink-soft:#4B564F; --ink-faint:#7D897F; --rule:#CBD0C6;
    --accent:#D97B29; --accent-ink:#7A3E10; --accent-soft:#F3DFC4;
    --good:#2F7A4D; --good-soft:#DCEEE1; --bad:#C0392B; --bad-soft:#F6DEDA;
    --shadow: 0 1px 2px rgba(20,24,20,.06), 0 6px 20px rgba(20,24,20,.06);
    --radius: 10px;
    --font-display:'Bahnschrift','Segoe UI Semibold','Roboto Condensed','Arial Narrow',sans-serif;
    --font-body:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --font-mono:'Consolas','Cascadia Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181A; --surface:#1D2321; --surface-2:#242B27; --surface-3:#2C3430;
      --ink:#E9ECE6; --ink-soft:#A8B2A9; --ink-faint:#78837B; --rule:#333B34;
      --accent:#F0A050; --accent-ink:#FFE1BB; --accent-soft:#3A2B18;
      --good:#4FAE74; --good-soft:#1C3327; --bad:#E06455; --bad-soft:#3A2220;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A; --surface:#1D2321; --surface-2:#242B27; --surface-3:#2C3430;
    --ink:#E9ECE6; --ink-soft:#A8B2A9; --ink-faint:#78837B; --rule:#333B34;
    --accent:#F0A050; --accent-ink:#FFE1BB; --accent-soft:#3A2B18;
    --good:#4FAE74; --good-soft:#1C3327; --bad:#E06455; --bad-soft:#3A2220;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#E3E6DE; --surface-3:#D9DCD2;
    --ink:#1A2420; --ink-soft:#4B564F; --ink-faint:#7D897F; --rule:#CBD0C6;
    --accent:#D97B29; --accent-ink:#7A3E10; --accent-soft:#F3DFC4;
    --good:#2F7A4D; --good-soft:#DCEEE1; --bad:#C0392B; --bad-soft:#F6DEDA;
    --shadow: 0 1px 2px rgba(20,24,20,.06), 0 6px 20px rgba(20,24,20,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16.5px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }

  .app{ max-width:1280px; margin:0 auto; padding:22px 20px 64px; }

  /* ---------- Header ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding:6px 4px 18px; border-bottom:2px solid var(--ink);
    flex-wrap:wrap;
  }
  .masthead .brand{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-ink); background:var(--accent-soft); padding:3px 8px; border-radius:4px;
  }
  h1.title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(22px,3vw,30px);
    margin:0; letter-spacing:.01em; text-wrap:balance;
  }
  .masthead .meta{
    font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); text-align:right;
  }

  /* ---------- Layout: rail + content ---------- */
  .layout{ display:grid; grid-template-columns: 250px 1fr; gap:22px; margin-top:22px; align-items:start; }
  @media (max-width: 860px){ .layout{ grid-template-columns:1fr; } }

  .rail{
    display:flex; flex-direction:column; gap:6px; position:sticky; top:16px;
    background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--radius);
    padding:10px;
  }
  .rail-heading{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); padding:6px 8px 2px;
  }
  .rail-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:8px;
    padding:9px 10px; cursor:pointer; color:var(--ink); font:inherit; font-size:14.5px;
  }
  .rail-item:hover{ background:var(--surface); }
  .rail-item.active{ background:var(--surface); border-color:var(--rule); box-shadow:var(--shadow); }
  .rail-item .code{
    font-family:var(--font-mono); font-weight:700; font-size:11.5px; letter-spacing:.04em;
    width:30px; flex:none; color:var(--ink-faint);
  }
  .rail-item.active .code{ color:var(--accent-ink); }
  .rail-item .label{ flex:1; line-height:1.25; }
  .rail-item .dot{
    flex:none; width:9px; height:9px; border-radius:50%; background:var(--rule);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .rail-item .dot.some{ background:var(--accent); }
  .rail-item .dot.done{ background:var(--good); }
  .rail-item .dot.done.wrong{ background:var(--bad); }
  .rail-divider{ height:1px; background:var(--rule); margin:8px 4px; }
  .rail-exam{ border-top:1px dashed var(--rule); margin-top:4px; padding-top:8px; }

  /* ---------- Content panel ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius);
    box-shadow:var(--shadow); min-height:420px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:18px 22px; border-bottom:1px solid var(--rule);
  }
  .panel-head h2{
    font-family:var(--font-display); font-size:22px; margin:0; text-wrap:balance;
  }
  .panel-head .sub{ font-size:13.5px; color:var(--ink-soft); font-family:var(--font-mono); }

  .subtabs{ display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
  .subtab{
    font:inherit; font-family:var(--font-display); font-size:14px; letter-spacing:.02em;
    background:none; border:none; border-bottom:3px solid transparent; color:var(--ink-soft);
    padding:11px 6px; margin-right:16px; cursor:pointer;
  }
  .subtab:hover{ color:var(--ink); }
  .subtab.active{ color:var(--ink); border-bottom-color:var(--accent); font-weight:700; }

  .panel-body{ padding:22px; }
  @media (max-width:560px){ .panel-body{ padding:16px; } .panel-head{padding:14px 16px;} .subtabs{padding:0 16px;} }

  /* ---------- Theory typography ---------- */
  .theory h3{
    font-family:var(--font-display); font-size:17px; margin:26px 0 8px; letter-spacing:.01em;
    color:var(--ink);
  }
  .theory h3:first-child{ margin-top:0; }
  .theory h4{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent-ink); margin:18px 0 6px;
  }
  .theory p{ margin:0 0 10px; max-width:66ch; }
  .theory ul{ margin:0 0 12px; padding-left:1.2em; max-width:66ch; }
  .theory li{ margin:0 0 5px; }
  .theory strong{ color:var(--ink); }
  .theory .term{
    font-family:var(--font-mono); font-weight:700; background:var(--surface-2);
    padding:0 4px; border-radius:3px; font-size:.92em;
  }
  .quote{
    border-left:3px solid var(--accent); background:var(--surface-2); border-radius:0 8px 8px 0;
    padding:10px 14px; margin:14px 0; font-style:italic; color:var(--ink-soft); max-width:60ch;
  }
  .quote cite{ display:block; font-style:normal; font-family:var(--font-mono); font-size:11.5px;
    color:var(--ink-faint); margin-top:4px; }

  /* ---------- Flashcards ---------- */
  .cardgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .fc{ perspective:1200px; height:150px; cursor:pointer; }
  .fc-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.7,.3,1);
    transform-style:preserve-3d;
  }
  .fc.flipped .fc-inner{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion:reduce){ .fc-inner{ transition:none; } }
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
    border:1px solid var(--rule); padding:14px; display:flex; flex-direction:column;
    justify-content:center; overflow:auto;
  }
  .fc-front{ background:var(--surface-2); }
  .fc-front .fc-term{
    font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ink);
  }
  .fc-front .fc-hint{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.08em;
    text-transform:uppercase; margin-top:8px;
  }
  .fc-back{ background:var(--accent-soft); transform:rotateY(180deg); }
  .fc-back p{ margin:0; font-size:13.5px; line-height:1.45; color:var(--ink); }
  .fc:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:10px; }

  /* ---------- Quiz ---------- */
  .qcount{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .qcard{
    border:1px solid var(--rule); border-radius:10px; padding:16px 18px; margin-bottom:14px;
    background:var(--surface);
  }
  .qcard.answered.correct{ border-color:var(--good); }
  .qcard.answered.wrong{ border-color:var(--bad); }
  .qnum{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.06em;

  .qtext{ font-family:var(--font-display); font-size:16px; margin:4px 0 12px; text-wrap:balance; }
  .opts{ display:flex; flex-direction:column; gap:7px; }
  .opt{
    display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:var(--surface-2); border:1px solid var(--rule); border-radius:8px;
    padding:9px 12px; cursor:pointer; font:inherit; font-size:14.5px; color:var(--ink);

  .opt:hover:not(:disabled){ background:var(--surface-3); }
  .opt .letter{
    font-family:var(--font-mono); font-weight:700; color:var(--ink-faint); flex:none; width:1.1em;
  }
  .opt:disabled{ cursor:default; }
  .opt.pick{ border-color:var(--ink-soft); }
  .opt.right{ background:var(--good-soft); border-color:var(--good); }
  .opt.right .letter{ color:var(--good); }
  .opt.chosen-wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .opt.chosen-wrong .letter{ color:var(--bad); }
  .opt:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .explain{
    margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--surface-2);

  .explain.show{ display:block; }
  .explain b{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;

  .verdict{ font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:.04em; }
  .verdict.ok{ color:var(--good); }
  .verdict.no{ color:var(--bad); }

  /* ---------- Buttons ---------- */
  .btn{
    font:inherit; font-family:var(--font-display); font-weight:700; font-size:14px;

  }
  .btn-primary{ background:var(--accent); color:#211205; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
  .btn-ghost{ background:transparent; border-color:var(--rule); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Exam results ---------- */
  .resultbar{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:18px; border-radius:10px;
    margin-bottom:20px; border:1px solid var(--rule); background:var(--surface-2);
  }
  .resultbar.pass{ border-color:var(--good); background:var(--good-soft); }
  .resultbar.fail{ border-color:var(--bad); background:var(--bad-soft); }
  .score{

    font-family:var(--font-mono); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    padding:5px 12px; border-radius:99px;
  }
  .pill.pass{ background:var(--good); color:#0B1F15; }
  .pill.fail{ background:var(--bad); color:#2A0D08; }
  table.breakdown{ width:100%; border-collapse:collapse; font-size:14.5px; }
  table.breakdown caption{ text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }
  table.breakdown th{
    text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); border-bottom:1px solid var(--rule); padding:7px 8px;
  }
  table.breakdown td{ border-bottom:1px solid var(--rule); padding:8px; }
  table.breakdown td.num, table.breakdown th.num{ text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  table.breakdown .code{ font-family:var(--font-mono); font-weight:700; color:var(--accent-ink); }
  .tablewrap{ overflow-x:auto; margin-bottom:22px; }

  /* ---------- Reference tables (Resumen) ---------- */
  table.reftable{ width:100%; border-collapse:collapse; font-size:14.5px; max-width:76ch; }
  table.reftable th{
    text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); border-bottom:2px solid var(--rule); padding:8px 10px;
  }
  table.reftable td{ border-bottom:1px solid var(--rule); padding:10px; vertical-align:top; }
  table.reftable td.term{ font-family:var(--font-mono); font-weight:700; color:var(--accent-ink); white-space:nowrap; }
  table.reftable tr:last-child td{ border-bottom:none; }

  .examfoot{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    margin-top:8px; padding-top:14px; border-top:1px dashed var(--rule);

  footer.note{
    margin-top:26px; font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono);
    text-align:center;
  }
</style>

<script>
(function(){

/* ============== DATA: MODULES (theory + flashcards) ============== */
var MODULES = [
{
  id:'in', code:'IN', name:'Introducción a Lean',
  theory: '' +
    '<h3>¿Por qué Lean?</h3>' +
    '<p>En TI perseguimos casi siempre los mismos objetivos: añadir valor, optimizar recursos, reducir costes, acortar el <em>time to market</em> y ganar en eficiencia. El problema es que, en la práctica, negocio y TI no siempre se entienden bien entre sí. Los sistemas suelen ser complejos, lentos y costosos de cambiar; TI tiende a centrarse en lo técnico antes que en el problema de negocio que hay detrás; a cada lado se habla, casi literalmente, un idioma distinto; y sobra información sin que eso ayude realmente a decidir mejor. A eso se suman los proyectos que fracasan, los sistemas desconectados entre sí, los datos de mala calidad y la tendencia de cada usuario a gestionar su propia información al margen del sistema oficial. Del lado de TI el panorama tampoco ayuda: el día a día se llena de <strong>firefighting</strong> — apagar incidencias sin planificar, hasta el punto de que ese trabajo no planificado acaba superando al planificado —, los requisitos llegan poco claros, las prioridades cambian constantemente, los recursos se reparten entre proyectos sin descanso, y todo ello convive con recursos compartidos, requisitos regulatorios, la externalización de servicios y presupuestos cada vez más ajustados. El resultado casi siempre es el mismo: un foco excesivo en el coste, con un retorno de la inversión que nadie sabe explicar del todo bien. La pregunta de fondo que plantea Lean IT es si el objetivo de TI debe ser simplemente "alinearse" con el negocio o, directamente, habilitar su crecimiento.</p>' +
    '<h3>Breve historia de Lean</h3>' +
    '<p>La historia de Lean puede leerse como un relevo de modelos de producción. Todo empieza en 1887 con la producción artesanal: piezas personalizadas, hechas por mano de obra muy cualificada, a un coste elevado. En 1910, <span class="term">Taylor</span> introduce la gestión científica del trabajo y pone el foco en la productividad laboral, un paso que allana el camino para que, en 1920, llegue la producción en masa: la línea de montaje abarata los costes, pero impone a cambio un modelo rígido e inflexible. Treinta años más tarde, en 1950, <span class="term">Deming</span> lleva a Japón la idea de mejorar los procesos de negocio a través de lo que hoy conocemos como el ciclo PDCA — un país que, tras la Segunda Guerra Mundial, tenía que mejorar con muy pocos recursos disponibles. De ese contexto nace, en 1955, el <strong>Toyota Production System</strong>, apoyado en la calidad, el Just-in-Time, el Jidoka, la mejora continua y el respeto por las personas. Ya en el año 2000, <span class="term">Jack Welch</span> demuestra en General Electric que la mejora continua funciona igual de bien en los servicios, dando lugar al concepto de <em>Lean in Service</em>. De toda esa evolución nace la fórmula <strong>Lean + IT = Lean IT</strong>: literalmente, aprender del pasado para aplicarlo a la tecnología.</p>' +
    '<h4>Tres metodologías relacionadas</h4>' +
    '<p>Antes de seguir conviene distinguir Lean de otras dos metodologías con las que a menudo se confunde. <strong>Six Sigma</strong> nace en 1990 en Motorola y General Electric con el objetivo de reducir la variación mediante el análisis estadístico y la resolución de problemas (el ciclo DMAIC); su objeto de estudio es el producto y su estilo se basa en hechos y datos. El <strong>Lean Manufacturing</strong>, por su parte, busca eliminar el desperdicio y optimizar los procesos: trabaja con algo tangible, predecible, estructurado y medible — la máquina —, y su estilo es de ajuste fino (<em>tuning</em>). El <strong>Lean Services</strong> traslada esa misma ambición de eliminar desperdicio y establecer un flujo de valor al terreno de los servicios, mucho más intangible, impredecible, caótico y difícil de medir, porque su objeto no es una máquina sino las personas, y su estilo es, por tanto, de cambio. Lean IT es la evolución natural de estas tres corrientes aplicada a la tecnología.</p>' +
    '<h3>La "casa" Lean</h3>' +
    '<p>Una forma clásica de representar Lean es como una casa. Se apoya sobre una base de <span class="term">Estabilidad</span> y <span class="term">Robustez</span> — las 5S y el Kaizen —, y desde ahí se levantan dos pilares: uno formado por <span class="term">Heijunka</span> y <span class="term">Just in Time</span>, que sostiene la Entrega (Delivery), y otro formado por <span class="term">Standard Working</span> y <span class="term">Jidoka</span>, que sostiene los Costes. El tejado de esa casa es la <strong>Calidad</strong>.</p>' +
    '<p>El <strong>Jidoka</strong> es la automatización inteligente, o "automatización con toque humano": el propio sistema detecta una anomalía y detiene el proceso antes de que el defecto se propague. Cuando eso ocurre se dispara un <strong>Andon</strong>, que no es solo una alerta — Andon es alerta más procedimiento más empoderamiento para actuar de inmediato sobre ese problema. El <strong>Just in Time</strong> persigue tener el recurso correcto, en el momento correcto y en la cantidad correcta, mientras que el <strong>Heijunka</strong>, o "nivelación de la producción", busca el equilibrio entre flexibilidad y estabilidad necesario para lograr predictibilidad. Por último, el <strong>Standard Working</strong> establece que cada paso de un proceso debe estar definido y ejecutarse siempre de la misma manera — como resume Bruce Lee: <em>"Temo al hombre que ha practicado una patada 10.000 veces, no al que ha practicado 10.000 patadas una vez."</em></p>' +
    '<h3>¿Por qué ser Lean?</h3>' +
    '<p>Los motivos para adoptar Lean se agrupan en tres bloques. En el plano de la <strong>satisfacción del cliente</strong>, centrarse en su valor mejora directamente su experiencia y abre un diálogo continuo con él. En el plano del <strong>valor estratégico</strong>, la mejora continua da lugar a mejores productos, aumenta la implicación y la motivación del personal, y permite entregar antes. Y en el plano <strong>financiero</strong>, menos desperdicio se traduce en más tiempo disponible para actividades que sí añaden valor y en un plazo más corto entre el pedido y la entrega, lo que mejora directamente el flujo de caja. Conviene no perder de vista, además, que la mala calidad siempre tiene un precio: fuera de la organización, en forma de daño reputacional, pérdida de confianza, multas o incluso pérdida de la licencia para operar; y dentro de la organización, en forma de retrabajo, desperdicio de recursos, interrupciones de la producción, horas extra y pérdida de espíritu de equipo. Por eso Lean prioriza construir la <strong>calidad dentro del propio proceso</strong>, en lugar de confiar en una auditoría de calidad al final de la cadena.</p>' +
    '<h3>Valor y desperdicio (Muda)</h3>' +
    '<p>El <strong>valor</strong> lo define siempre el cliente: es aquello por lo que está dispuesto a pagar. Todo lo que hacemos y no añade valor desde su perspectiva es, por definición, desperdicio — en japonés, <strong>Muda</strong> —, aunque en ocasiones ese trabajo sea legalmente obligatorio y por tanto una forma de valor no añadido necesario. Lean identifica ocho tipos de desperdicio que se recuerdan con el acrónimo <strong>DOWNTIME</strong>: <strong>D</strong>efects (defectos), <strong>O</strong>verproduction (sobreproducción), <strong>W</strong>aiting (esperas), <strong>N</strong>on-utilized talent (talento no utilizado), <strong>T</strong>ransportation (transporte), <strong>I</strong>nventory (inventario), <strong>M</strong>otion (movimiento) y <strong>E</strong>xtra-processing (sobre-procesamiento). Junto al Muda existen otras dos barreras para el flujo de valor: la <span class="term">Mura</span>, o variabilidad e inconsistencia en el volumen o la complejidad de la demanda del cliente (o en el resultado de los propios procesos), y el <span class="term">Muri</span>, o sobrecarga — la incapacidad del equipo de escalar su capacidad hacia arriba o hacia abajo según la demanda, que en gran parte es un desperdicio derivado de las propias políticas y normas de la organización.</p>' +
    '<h3>Los 5 principios Lean</h3>' +
    '<p>En el centro de todo está el <strong>Customer Value</strong>, el valor del cliente. Alrededor de ese centro giran cuatro principios más: el <strong>Value Stream</strong>, que evalúa qué actividades añaden realmente valor a ojos del cliente; el <strong>Flow</strong>, que busca crear un flujo continuo apoyado en el Just-in-Time y evitar los picos y valles de producción; el <strong>Pull</strong>, según el cual es la demanda la que dispara la cadena de proceso, de modo que nada se produce hasta que el siguiente paso realmente lo necesita; y la <strong>Perfection</strong>, entendida como hacerlo bien a la primera, priorizando la prevención de defectos frente al control de calidad posterior.</p>' +
    '<h3>Tres tipos de actividad</h3>' +
    '<p>Desde el punto de vista del cliente, toda actividad de un proceso se puede clasificar en tres categorías. El trabajo de <strong>valor añadido (VA)</strong> es aquel por el que el cliente está dispuesto a pagar, y por tanto conviene <em>maximizarlo</em>. El trabajo <strong>necesario sin valor añadido (NNVA)</strong> no aporta valor directo al cliente, pero es imprescindible para que el trabajo de valor pueda llevarse a cabo — piénsese en finanzas, contratación o testing —, así que el objetivo es <em>minimizarlo</em>, no eliminarlo. Y el trabajo <strong>sin valor añadido</strong>, el Muda propiamente dicho, no aporta nada ni al cliente ni al negocio — el retrabajo, las esperas o un inventario de incidentes acumulado son ejemplos típicos — y, por tanto, hay que <em>eliminarlo</em>.</p>' +
    '<h3>¿Qué es Lean IT?</h3>' +
    '<div class="quote">"Lean IT es la extensión de los principios de Lean Manufacturing y Lean Services al desarrollo y la gestión de productos y servicios de tecnología de la información. Su objetivo es mejorar continuamente el valor entregado por las organizaciones de TI a sus clientes y el profesionalismo de las personas de TI."</div>' +
    '<p>Lean IT no sustituye a otros marcos de buenas prácticas, sino que los complementa: mientras esos marcos explican <em>cómo debería organizarse</em> un proceso, las herramientas Lean sirven para <em>optimizarlo</em> y reducir su desperdicio, con el foco puesto en las personas y en las actitudes. Como decía Taiichi Ohno: <em>"Si crees que el estándar es lo mejor que puedes hacer, se acabó. El estándar es solo una base para seguir haciendo Kaizen."</em></p>' +
    '<h4>Las 5 dimensiones de Lean IT</h4>' +
    '<p>Todo el contenido de este curso se organiza alrededor de cinco dimensiones. En el centro se sitúa el <strong>Comportamiento y la Actitud</strong>. A su alrededor están el <strong>Cliente</strong> (¿quién es? ¿qué valora?), el <strong>Proceso</strong> (la secuencia de actividades por las que el cliente realmente paga), la <strong>Organización</strong> (¿está estructurada de forma orientada al cliente? ¿cómo trabajamos en equipo?) y el <strong>Rendimiento</strong> (¿cuánto tiempo dedicamos a actividades de valor? ¿cuál es el desempeño de equipos e individuos?). Estas cinco dimensiones son, de hecho, la misma estructura que sigue el resto de esta guía.</p>' +
    '<h4>Lean IT, DevOps y Agile</h4>' +
    '<p>Los tres enfoques comparten filosofía y se complementan bien: Lean IT aporta la mentalidad de mejora continua y eliminación de desperdicio, Agile aporta la forma iterativa de trabajar, y DevOps conecta desarrollo y operaciones para acelerar el flujo de valor de principio a fin.</p>' +
    '<h3>Kaizen y Kaikaku</h3>' +
    '<p>Lean contempla dos velocidades de cambio. El <strong>Kaizen</strong> es la evolución incremental: mejora continua en pasos pequeños, sostenida en el tiempo. El <strong>Kaikaku</strong>, en cambio, es el cambio radical, la revolución. Lean se apoya principalmente en el Kaizen, pero en ocasiones hace falta recurrir al Kaikaku.</p>' +
    '<h4>El ciclo de Deming (PDCA)</h4>' +
    '<p>El ciclo de Deming es parte integral de la filosofía Lean y encarna su objetivo de mejora continua. Empieza por <strong>Plan</strong>: diseñar o revisar los componentes de un proceso de negocio para mejorar sus resultados. Sigue con <strong>Do</strong>: implementar ese plan y medir su desempeño. Continúa con <strong>Check</strong>: evaluar las mediciones obtenidas y reportar los resultados a quien tiene que decidir. Y se cierra con <strong>Act</strong>: decidir qué cambios hacen falta para seguir mejorando el proceso — momento en el que el ciclo vuelve a empezar.</p>',
  flashcards:[
    {t:'Muda', d:'Desperdicio: cualquier actividad que no añade valor desde la perspectiva del cliente.'},
    {t:'Mura', d:'Variabilidad o inconsistencia en el volumen/complejidad de la demanda del cliente, o en el resultado de los procesos.'},
    {t:'Muri', d:'Sobrecarga: incapacidad de cumplir la demanda del cliente porque la capacidad del equipo no puede escalar arriba o abajo; en gran parte es desperdicio basado en políticas.'},
    {t:'Jidoka', d:'"Automatización con toque humano": el proceso detecta una anomalía y se detiene automáticamente para evitar propagar el defecto.'},
    {t:'Andon', d:'No es solo una alerta: Andon = alerta + procedimiento + empoderamiento para actuar sobre el problema.'},
    {t:'Heijunka', d:'Nivelación de la producción ("production smoothing"): equilibrio entre flexibilidad y estabilidad para lograr predictibilidad.'},
    {t:'Just in Time (JIT)', d:'El material/recurso correcto, en el momento correcto, en el lugar correcto y en la cantidad exacta.'},

    {t:'No-valor-añadido (Muda)', d:'No añade valor ni al cliente ni al negocio: es desperdicio puro. Se debe eliminar.'},

{
  id:'cu', code:'CU', name:'El Cliente',
  theory: '' +
    '<h3>La Voz del Cliente (Voice of the Customer)</h3>' +
    '<p>Es el cliente quien define qué es valor, siempre en el contexto de un producto o un servicio concreto, y para entenderlo bien hay que mirar su experiencia completa, de principio a fin, no solo el momento en que interactúa directamente con nosotros. Conviene distinguir dos tipos de cliente: la persona que usa de verdad tu producto o servicio (que puede ser interna o externa a la organización) y la siguiente persona en la cadena del value stream, es decir, quien recibe tu trabajo justo después de ti. Para analizar bien la Voz del Cliente conviene hacerse siempre las mismas cuatro preguntas: ¿quién es mi cliente?, ¿qué quiere?, ¿qué actividades le añaden valor? y ¿por qué actividades está dispuesto a pagar?</p>' +
    '<p>Lo que un cliente valora no es lo mismo en un producto que en un servicio, aunque hay paralelismos claros. En un <strong>producto</strong>, valora cosas como el rendimiento, las características, la conformidad con lo prometido, la puntualidad, la fiabilidad, la capacidad de servicio postventa, la durabilidad, la estética, la reputación de la marca, la integridad y el precio. En un <strong>servicio</strong>, en cambio, lo que pesa es la competencia de quien lo presta, la fiabilidad, la precisión, la puntualidad, la capacidad de respuesta, el acceso, la cortesía, la comunicación, la credibilidad, la comprensión de sus necesidades y, de nuevo, el precio.</p>' +
    '<h3>Del valor del cliente a objetivos medibles: el árbol CTQ</h3>' +
    '<p>El árbol <span class="term">CTQ</span> (Critical to Quality) es la herramienta que traduce ese valor del cliente (VOC) en medidas de desempeño internas, y lo hace en tres pasos. Primero hay que <strong>entender la Voz del Cliente</strong>, separando lo que es un requisito imprescindible de lo que es simplemente un deseo. Después se <strong>determinan los CTQ</strong>: de todos esos requisitos y deseos, se seleccionan los que más afectan a la experiencia de valor del cliente. Y por último se <strong>identifican los atributos clave</strong>, es decir, las variables internas que más influyen en el desempeño de cada CTQ y que sí podemos medir y gestionar nosotros. Un ejemplo ayuda a verlo con claridad: si el objetivo estratégico es un centro de llamadas con "buen servicio" (la Voz del Cliente), eso se puede traducir en dos CTQ — "respuesta rápida" y "servicio personalizado" — y estos, a su vez, en un atributo medible como "identificación del cliente en menos de 1 segundo mediante base de datos".</p>' +
    '<p style="font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 14px;"><strong>⚠️ Aviso de examen:</strong> en la versión en español del examen real, CTQ no siempre aparece como sigla — puede mostrarse traducido como <strong>"Características Críticas de Calidad"</strong>. Conviene reconocer el concepto por su definición, no solo por las siglas en inglés.</p>' +
    '<h3>Cómo investigar la Voz del Cliente</h3>' +
    '<p>Existen varias formas de escuchar de verdad al cliente, y suele convenir combinarlas. La <strong>segmentación</strong> reconoce que los clientes tienen necesidades y capacidad de gasto distintas, y que conviene tratarlos de forma diferenciada. La <strong>observación</strong> consiste en ver cómo usa el cliente el producto o servicio en su propio contexto, en lugar de imaginarlo desde nuestro escritorio. Las <strong>entrevistas</strong> — en grupos focales, cara a cara o por teléfono — permiten obtener feedback directo e identificar requisitos. Las <strong>encuestas</strong> sirven para recoger datos cuantitativos de una muestra amplia de clientes. Y las <strong>redes sociales</strong>, como Facebook o Twitter, aportan una fuente adicional, más espontánea, de lo que opinan.</p>' +
    '<h3>El modelo Kano</h3>' +
    '<p>El modelo Kano clasifica cómo la presencia (o ausencia) de una característica afecta a la satisfacción del cliente, y distingue tres tipos. Las características <strong>Must Be</strong>, o insatisfactores, son las que deben estar presentes sí o sí: su ausencia genera insatisfacción, pero tenerlas tampoco genera entusiasmo — simplemente se dan por hechas. Las características de <strong>Performance</strong>, o satisfactores, tienen una relación directa con la Voz del Cliente: cuanto más presentes están, mayor es la satisfacción. Y los <strong>Delighters</strong> son ese extra inesperado: su ausencia no insatisface a nadie, pero su presencia sí entusiasma — aunque conviene recordar que, con el tiempo, los <em>delighters</em> de hoy tienden a convertirse en el estándar básico de mañana.</p>' +
    '<h3>Otras fuentes de iniciativas de mejora</h3>' +
    '<p>El cliente no es la única fuente de mejoras. La <strong>Voice of Business</strong> identifica mejoras que ayudan a la organización a lograr sus propios objetivos estratégicos. La <strong>Voice of the Process</strong> identifica mejoras a partir del desempeño real del propio proceso. Y la <strong>Voice of the Regulator</strong> identifica mejoras que vienen impuestas por requisitos legales o normativos.</p>',
  flashcards:[
    {t:'Voice of the Customer (VOC)', d:'El cliente define qué es valor; hay que entender toda su experiencia de principio a fin.'},
    {t:'Dos tipos de cliente', d:'Quien usa tu producto/servicio (interno/externo) y quien está a continuación en el value stream.'},
    {t:'CTQ (Critical to Quality)', d:'Traduce la Voz del Cliente (requisitos y deseos) en objetivos y medidas de desempeño internas, medibles. En español puede aparecer como "Características Críticas de Calidad".'},
    {t:'Árbol CTQ', d:'Objetivo estratégico → Voz del Cliente → CTQ → Atributos clave (medidas internas).'},
    {t:'Modelo Kano — Must Be', d:'Característica que debe estar presente; su ausencia insatisface, su presencia no entusiasma.'},
    {t:'Modelo Kano — Performance', d:'Relación directa con la satisfacción: a más presencia, más satisfacción del cliente.'},
    {t:'Modelo Kano — Delighters', d:'Se reciben como un extra; sorprenden positivamente al cliente (con el tiempo, se vuelven expectativa básica).'},
    {t:'Voice of Business / Process / Regulator', d:'Otras fuentes de mejora: objetivos de la organización, desempeño del proceso y requisitos legales.'}
  ]
},
{
  id:'pr', code:'PR', name:'El Proceso',
  theory: '' +
    '<h3>Componentes clave de un proceso</h3>' +
    '<p>Todo proceso persigue un <strong>objetivo</strong> a través de una serie de <strong>actividades</strong> que producen un <strong>resultado</strong> para el cliente. Si bajamos al nivel operativo, lo que ocurre en realidad es una <strong>transformación</strong>: unas entradas — materiales, máquinas, información, mano de obra — se convierten en salidas — bienes, información, servicios — que llegan al cliente, y todo ese recorrido está gobernado por medidas, controles, responsabilidades y roles. Formalmente, un proceso es <em>"una serie de acciones que deben realizarse correctamente, en la secuencia correcta y en el momento correcto, para crear valor para un cliente"</em>. A un nivel muy abstracto, toda organización tiene en realidad solo tres procesos: <strong>Design</strong>, del concepto al lanzamiento (desarrollo de producto y de proceso); <strong>Delivery</strong>, desde que se toma el pedido hasta que se entrega; y <strong>Support</strong>, durante todo el ciclo de vida en que el cliente usa el producto.</p>' +
    '<p>El documento que describe la mejor forma conocida de ejecutar un paso o un proceso en un momento dado se llama <span class="term">SOP</span> (Standard Operating Procedure). Conviene tener presente, eso sí, que en TI la resolución de incidentes responde a una lógica distinta: se trata de demanda de <em>fallo</em>, no de demanda de valor, así que a ese proceso concreto lo llamamos <strong>Failure Stream</strong>.</p>' +
    '<h3>Push y Pull aplicados a mejorar procesos</h3>' +
    '<p>Un proceso puede organizarse en modo <strong>Push</strong> o en modo <strong>Pull</strong>, y la diferencia es de fondo. En Push, el trabajo se basa en una previsión (<em>forecast</em>): se genera stock por adelantado, y eso puede acabar creando cuellos de botella (<em>bottleneck</em>). En Pull, en cambio, es el propio pedido del cliente el que dispara el trabajo; se apoya en el Just in Time y busca el <strong>flujo de una sola pieza</strong> (single piece flow), evitando producir nada que no se haya pedido de verdad.</p>' +
    '<h3>Fase 1: SIPOC</h3>' +
    '<p>Antes de mapear un proceso en detalle hay que definir bien su alcance, empezando por la pregunta más básica: ¿quién es el cliente de este proceso? (de la Voz del Cliente al árbol CTQ). Para eso sirve el <span class="term">SIPOC</span> (Suppliers, Input, Process, Output, Customer): una vista de alto nivel del proceso que ayuda a acordar el alcance antes de construir un Value Stream Map completo. Identifica quién provee la entrada, qué entra exactamente, cuáles son los pasos principales del proceso a analizar, qué sale de él y quién recibe esa salida.</p>' +
    '<h3>Fase 2: Análisis del proceso — Value Stream Mapping (VSM)</h3>' +
    '<div class="quote">"El VSM es un método Lean para analizar el estado actual y diseñar un estado futuro para la serie de eventos que llevan un producto o servicio desde el inicio hasta el cliente."<cite>Wikipedia, 2014</cite></div>' +
    '<p>Para cada paso del proceso, el VSM documenta la unidad de trabajo, el <em>takt rate</em> (el ritmo al que llega la demanda), el <em>lead time</em>, el tiempo de máquina, el tiempo de cambio (<em>changeover</em>) y los distintos flujos de trabajo — qué porcentaje de pedidos sigue cada ruta —, además del desperdicio que se identifica en cada paso. Para representarlo se usa un lenguaje visual compartido: símbolos para el transporte de bienes, el inventario, el tiempo de espera, el movimiento de personas, el retrabajo, el sobre-procesamiento y la sobreproducción; flechas discontinuas para el flujo de información y continuas para el flujo físico; un icono para el proveedor externo; y cajas para cada proceso o paso de proceso, con su lead time, sus problemas o incidencias señalados con una almohadilla, y las opciones de Kaizen que se van identificando por el camino.</p>' +
    '<p>Un ejemplo ilustra bien lo que suele encontrarse: en un proceso de gestión de cambios con cinco pasos — recepción, intake, planificación, entrega y traspaso a operaciones — el <em>lead time</em> total puede ser de 20 días, unos 5.272 minutos, mientras que el tiempo real de trabajo (la suma de los <em>cycle time</em>) apenas representa un 6,6% de ese total. El resto son esperas entre pasos, y es precisamente ese desperdicio el que Lean busca reducir.</p>' +
    '<p>Conviene no confundir el <strong>lead time</strong> con el <strong>cycle time</strong>. El lead time es el que percibe el cliente: el reloj arranca en el momento en que se hace la petición y se detiene en el momento de la entrega. El cycle time, en cambio, arranca cuando alguien empieza de verdad a trabajar en la petición y se detiene cuando el resultado está listo para entregar. La pregunta que hay que hacerse al terminar un VSM es si de verdad se ha logrado el flujo, y la clave para conseguirlo es el <strong>Heijunka</strong>: evitar cuellos de botella, reducir la Mura (la variabilidad) y lograr que cada paso del proceso pueda procesar la misma cantidad de unidades de trabajo por unidad de tiempo.</p>' +
    '<h3>5S</h3>' +
    '<p>Las 5S son cinco disciplinas japonesas que se aplican en orden y se refuerzan entre sí. <strong>Seiri</strong>, o clasificar, consiste en eliminar herramientas, piezas e instrucciones innecesarias, quedándose solo con lo esencial y dejándolo accesible. <strong>Seiton</strong>, u ordenar, establece que debe haber un lugar para cada cosa, y cada cosa debe estar en su lugar, claramente indicado. <strong>Seiso</strong>, o limpiar, implica dejar limpios el puesto de trabajo y todo el equipo al final de cada turno, de forma que sea fácil saber qué va dónde. <strong>Seiketsu</strong>, o estandarizar, exige que las prácticas de trabajo sean consistentes, de manera que cualquiera pueda trabajar en cualquier puesto con las mismas herramientas y los mismos procedimientos. Y <strong>Shitsuke</strong>, o mantener, es la disciplina de revisar los estándares y convertirlos en hábito, para seguir mejorando de forma sostenida.</p>',
  flashcards:[
    {t:'Proceso (definición)', d:'Serie de acciones que deben realizarse correctamente, en la secuencia correcta y en el momento correcto, para crear valor para un cliente.'},
    {t:'Design / Delivery / Support', d:'Los 3 procesos abstractos de toda organización: del concepto al lanzamiento, de pedido a entrega, y soporte durante el uso.'},
    {t:'SOP', d:'Standard Operating Procedure: documento que describe la mejor forma conocida de ejecutar un paso/proceso en un momento dado.'},
    {t:'Failure Stream', d:'El proceso de resolver incidentes en TI: se basa en demanda de fallo, no de valor.'},
    {t:'Push vs Pull', d:'Push: previsión, stock, cuello de botella. Pull: pedido del cliente, Just in Time, flujo de una sola pieza.'},
    {t:'SIPOC', d:'Suppliers, Input, Process, Output, Customer: vista de alto nivel de un proceso para acordar el alcance de un VSM.'},
    {t:'VSM (Value Stream Mapping)', d:'Método Lean para analizar el estado actual y diseñar el estado futuro del flujo que lleva un producto/servicio al cliente.'},
    {t:'Lead time', d:'Desde que se hace la petición hasta la entrega — lo que percibe el cliente.'},
    {t:'Cycle time', d:'Desde que empieza el trabajo sobre la petición hasta que está lista para entregar.'},
    {t:'5S', d:'Seiri (Clasificar), Seiton (Ordenar), Seiso (Limpiar), Seiketsu (Estandarizar), Shitsuke (Mantener/disciplina).'}
  ]
},
{
  id:'pe', code:'PE', name:'Rendimiento',
  theory: '' +
    '<h3>Medir: de métricas a KPI</h3>' +
    '<p>Medir el desempeño es lo que nos permite alcanzar objetivos relacionados con el valor del cliente, y es la base del ciclo de mejora PDCA: sin medir no hay forma de saber si estamos mejorando. El desempeño debe poder medirse tanto para el equipo como para los gestores y para los propios clientes, y el árbol <strong>CTQ</strong> es precisamente el que da el vínculo directo entre lo que el cliente valora y lo que debemos medir.</p>' +
    '<h4>KPI (Key Performance Indicator)</h4>' +
    '<p>Un KPI es una medida que expresa el desempeño de un objetivo organizativo clave, y para ser útil debe ser <strong>SMART</strong>: eSpecífico, Medible, Alcanzable, Relevante y Acotado en el Tiempo. Además, un buen KPI apoya la ejecución de la estrategia, es coherente en toda la organización — los KPI se despliegan en cascada, de lo estratégico a lo operativo —, es <strong>controlable por el propio equipo</strong> (no por el gestor), cuenta con un procedimiento de medición disponible y está pensado para durar en el tiempo, no para cambiarse cada pocos meses. A esto se suman cuatro cualidades que debe tener el sistema de KPI en su conjunto: <strong>foco en el cliente</strong>, de modo que contribuir a su valor importe más que "cumplir" formalmente un KPI; <strong>alineación</strong> con la estrategia; <strong>medición continua</strong>, gestionando la tendencia en lugar de revisar una vez al año; y <strong>equilibrio</strong> a lo largo de toda la organización.</p>' +
    '<p style="font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 14px;"><strong>⚠️ Aviso de examen:</strong> en la versión en español del examen real, KPI también puede aparecer traducido como <strong>"Indicador Clave de Rendimiento"</strong> en lugar de las siglas en inglés. No des por hecho que verás siempre "KPI" escrito tal cual.</p>' +
    '<h4>La ficha de KPI</h4>' +
    '<p>Cada KPI se documenta en una ficha que recoge su definición, su categoría (calidad, productividad, tiempos, gestión de personas, mejora continua o financiero), el nivel al que se usa, su fórmula de cálculo, el proceso de recolección de datos (fuente, frecuencia y responsable), la unidad de medida, la línea base y el objetivo, la tolerancia admitida, la frecuencia de reporte, la precisión de la medición, quién es el propietario del proceso y qué incidencias conocidas tiene.</p>' +
    '<h3>El tiempo, factor de producción clave en TI</h3>' +
    '<p>Las personas son el recurso que hace que TI funcione, porque representan conocimiento contratado durante un tiempo determinado. Por eso dirigir bien el uso de ese tiempo es la palanca principal para aprovechar el conocimiento disponible: tenemos <strong>control</strong> directo del coste a través del tiempo (el control a través del salario es, en cambio, indirecto), y tenemos <strong>inmediatez</strong>, porque podemos cambiar de un momento a otro en qué está trabajando alguien.</p>' +
    '<h4>PCE / OPE — Process Cycle Efficiency</h4>' +
    '<p>El PCE mide qué porcentaje del tiempo se dedica a actividades de valor añadido, con una fórmula sencilla:</p>' +
    '<p style="font-family:var(--font-mono); background:var(--surface-2); padding:8px 12px; border-radius:6px; display:inline-block;">PCE = Tiempo de Valor Añadido / Lead Time Total</p>' +
    '<p>El dato suele sorprender: del tiempo total disponible de un equipo, a menudo <strong>no más del 15–30%</strong> se dedica realmente a actividades de valor añadido.</p>' +
    '<h3>Habilidades y Conocimientos (Skills &amp; Knowledge)</h3>' +
    '<p>El objetivo de este análisis es <strong>equilibrar la demanda y la oferta</strong> de habilidades del equipo, para poder entregar el valor que los clientes esperan. Cuando ese equilibrio no existe, aparece la inflexibilidad para asignar recursos a las tareas — que es, en sí misma, una forma de desperdicio. Por eso conviene impulsar un plan que desarrolle a las personas de un perfil único (single-skilled) hacia un perfil <strong>multidisciplinar</strong> (multi-skilled), normalmente apoyándose en una matriz de habilidades por proceso y persona, con niveles que van desde "no puede realizar la tarea" hasta "puede enseñarla a otros", pasando por "familiarizado", "puede realizarla con ayuda" y "puede realizarla solo". Comparando esa matriz con la demanda real del negocio — recogida en la llamada <em>service matrix</em> — se define el plan de acción para cerrar la brecha.</p>',
  flashcards:[
    {t:'KPI', d:'Medida SMART (Específico, Medible, Alcanzable, Relevante, Acotado en el tiempo) del desempeño de un objetivo organizativo clave; controlable por el equipo, no por el gestor. En español puede aparecer como "Indicador Clave de Rendimiento".'},
    {t:'Requisitos de un buen sistema de KPI', d:'Foco en el cliente, alineación con la estrategia, medición continua (gestionar la tendencia), y equilibrio en toda la organización.'},
    {t:'Ficha de KPI', d:'Documenta definición, categoría, fórmula, fuente de datos, unidad, línea base, objetivo, tolerancia, frecuencia y propietario del proceso.'},
    {t:'Tiempo como factor de producción', d:'En TI el tiempo es el factor clave: representa el conocimiento contratado; permite control directo del coste y cambio inmediato de prioridades.'},
    {t:'PCE (Process Cycle Efficiency)', d:'% de tiempo dedicado a valor añadido = Tiempo de Valor Añadido / Lead Time total. Habitualmente solo 15–30%.'},
    {t:'Análisis de Habilidades y Conocimientos (S&K)', d:'Equilibra la demanda y la oferta de habilidades del equipo; el objetivo es desarrollar personal multidisciplinar (multi-skilled).'}
  ]
},
{
  id:'or', code:'OR', name:'Organización',
  theory: '' +
    '<h3>De la organización por funciones a la orientación al cliente</h3>' +
    '<p>En una organización <strong>funcional</strong>, organizada en silos, cada función ejecuta sus tareas de forma aislada: la función 1 hace lo suyo, la 2 lo suyo, la 3 lo suyo, y el pedido va pasando de una a otra sin que nadie tenga una visión completa. En una organización <strong>orientada al cliente</strong>, en cambio, son equipos multifuncionales — task forces, squads — los que recorren todo el flujo, de la función 1 a la 2 y a la 3, para un mismo pedido, de principio a fin.</p>' +
    '<h3>Empoderar a la primera línea</h3>' +
    '<p>Este cambio de modelo exige un cambio de foco todavía más profundo. En la jerarquía tradicional — Consejo, Alta Dirección, Mandos Intermedios y, al final, la Primera Línea, con el proceso primario en la base — la organización entera acaba "mirando hacia arriba" para saber qué hacer. Lean propone invertir esa pirámide y dirigir la mirada hacia lo que ocurre de verdad en el terreno de trabajo, es decir, hacia la mejora de los procesos primarios. En ese modelo invertido, la <strong>primera línea</strong> pasa a estar arriba, cerca del cliente, aportando ideas y aprendizaje; debajo, el personal de soporte; y en la base, el CEO, dando visión y apoyo al resto.</p>' +
    '<h3>Gestión visual (Visual Management)</h3>' +
    '<p>La gestión visual trata, sobre todo, de la comunicación eficaz del equipo y de las actualizaciones en tiempo real. Persigue varios objetivos a la vez: conectar a la dirección con la operación diaria del equipo, compartir información en un tablero para tener el estado, las prioridades y los problemas siempre a la vista, facilitar diálogos basados en hechos, dejar ver de un vistazo qué tarea no está avanzando, mantener una comunicación consistente y eficaz, y dar al equipo ciclos de feedback diarios de los que aprender lecciones. En la práctica, sin embargo, los gestores a menudo pasan menos del 10% de su tiempo con el equipo, y no llegan a saber realmente qué está haciendo.</p>' +
    '<h4>Los tres tableros para gestionar la operación</h4>' +
    '<p>Esta gestión visual se apoya en tres tableros que trabajan juntos. El <strong>day board</strong>, o tablero diario, gestiona el trabajo del día a día: quién está trabajando en qué, la moral del equipo, el consejo del día, el próximo evento. El <strong>week board</strong>, o tablero semanal, recoge los objetivos de la semana, los KPI del equipo, el barómetro del equipo, las lecciones aprendidas y las novedades. Y el <strong>improvement board</strong>, o tablero de mejora, hace seguimiento del progreso en la resolución de problemas, comunicando y compartiendo soluciones y lecciones aprendidas; recibe como entrada precisamente los "problemas" que se han identificado tanto en el tablero diario como en el semanal. El tablero diario y el semanal, además, se retroalimentan entre sí: del semanal al diario bajan los objetivos de la semana, y del diario al semanal sube el rendimiento y el progreso conseguido.</p>' +
    '<h4>Comunicación en cascada</h4>' +
    '<p>Gracias a esta cascada de tableros, la comunicación fluye con rapidez en ambos sentidos, de abajo arriba y de arriba abajo: a diario en el equipo, semanalmente entre el equipo y los mandos intermedios, semanalmente también en la alta dirección, y mensualmente en la dirección ejecutiva — y en cada nivel se puede "pedir apoyo" hacia arriba y "entregar apoyo" hacia abajo. Para que esto funcione de verdad, las agendas de gestión se alinean entre sí: el day start diario, el week start semanal, el diálogo de desempeño, el coaching, el kaizen y las reuniones de mandos y de dirección se organizan de forma que la información se reparta de la manera más eficiente posible.</p>' +
    '<h3>El diálogo de desempeño</h3>' +
    '<p>Un buen diálogo de desempeño tiene tres elementos esenciales. Primero, el <strong>objetivo</strong>: discutir el progreso frente a lo acordado y, si hace falta, definir un nuevo objetivo SMART. Segundo, <strong>ofrecer apoyo</strong>: preguntar simplemente si la persona necesita ayuda para completar su trabajo. Y tercero, el <strong>feedback</strong>: compartir retroalimentación y sugerencias de mejora sobre cómo se ha desempeñado o comportado. Lo importante es recordar que el diálogo de desempeño trata de <strong>discutir el logro de objetivos ya acordados</strong>, no de que el gestor imponga la solución al empleado — eso último reduce su autonomía y va justo en la dirección contraria a lo que busca Lean.</p>' +
    '<h3>Kanban (tablero de tareas)</h3>' +
    '<p>El Kanban visualiza el flujo de trabajo organizado en columnas — por ejemplo, To Do, Analysis, Development, Test y Done —, de forma que el estado y la carga de trabajo del equipo se puedan ver de un vistazo, sin necesidad de preguntar a nadie.</p>',
  flashcards:[
    {t:'Silos vs orientación al cliente', d:'Silos: cada función trabaja aislada por tareas. Orientado al cliente: equipos/squads recorren todo el flujo F1→F2→F3 de principio a fin.'},
    {t:'Empoderar la primera línea', d:'Invertir la pirámide: la primera línea conoce al cliente y debe poder actuar sin pedir permiso constante a la dirección.'},
    {t:'Gestión visual', d:'Comunicación de equipo eficaz y actualizaciones en tiempo real mediante tableros, para conectar a la dirección con la operación diaria.'},
    {t:'Day board', d:'Tablero diario: quién trabaja en qué, moral del equipo, problemas, consejo del día.'},
    {t:'Week board', d:'Tablero semanal: objetivos de la semana, KPI del equipo, lecciones aprendidas.'},
    {t:'Improvement board', d:'Tablero de mejora: progreso de la resolución de problemas; recibe como entrada los problemas del day/week board.'},
    {t:'Diálogo de desempeño', d:'3 elementos: Objetivo (progreso frente al objetivo), Apoyo (¿necesita ayuda?), Feedback (retroalimentación sobre desempeño/comportamiento).'},
    {t:'Kanban (tablero de tareas)', d:'Visualiza el flujo de trabajo por columnas (To Do, Analysis, Development, Test, Done).'}
  ]
},
{
  id:'ba', code:'BA', name:'Comportamiento y Actitud',
  theory: '' +
    '<h3>Lean es una forma de pensar y de actuar</h3>' +
    '<p>Lean supone adoptar una mentalidad distinta a la habitual, con varios rasgos que conviene interiorizar. Lo "bueno" nunca es el punto final: siempre se busca la perfección y el flujo. Los problemas dejan de verse como algo negativo y pasan a ser oportunidades para aportar más valor al cliente. Conviene pensar de forma contraintuitiva, porque la forma habitual de hacer las cosas no siempre es la mejor. El foco debe estar en entregar valor, no solo en recortar costes o generar beneficio. Hay que cultivar relaciones a largo plazo en las que todas las partes ganen, hacer que el comportamiento del día a día sea coherente con los objetivos de largo plazo, y mirar siempre el conjunto, no solo sus partes por separado.</p>' +
    '<h4>Comportamiento (externo) vs Actitud (interno)</h4>' +
    '<p>Conviene distinguir dos conceptos que a menudo se confunden. La <strong>actitud</strong> es interna: es "cómo abordo la situación". El <strong>comportamiento</strong> es externo y observable: es "cómo reacciono" ante ella. La actitud correcta es la que, con el tiempo, acaba traduciéndose en el comportamiento correcto.</p>' +
    '<h3>Comportamientos que motivan frente a comportamientos que generan desperdicio</h3>' +
    '<p>Hay comportamientos que alimentan un entorno Lean y otros que, sin darnos cuenta, generan desperdicio. Entre los primeros están la paciencia, la reflexión, la calma, la confianza, el diálogo constructivo y el feedback, la compasión, la comprensión, basarse en hechos validados, el respeto, la objetividad, la escucha, compartir el conocimiento con transparencia, la autocrítica con sentido del humor y la visibilidad. Entre los segundos — los que conviene evitar — están la negatividad, la revancha, el ego, la desconfianza o la adulación excesiva, la crítica destructiva, las observaciones irrelevantes, el cotilleo, las interpretaciones sin base, el sarcasmo, el prejuicio, la falta de atención, hacerse el "héroe local", el cinismo y la ocultación de información.</p>' +
    '<h3>¿Qué actitud requiere Lean?</h3>' +
    '<p>La actitud Lean se resume en unas pocas creencias, pero hay que sostenerlas de verdad: creer que la mejora siempre es posible, tener el deseo genuino de añadir valor a los clientes, creer en dar el siguiente paso por pequeño que sea, mantener una mente crítica pero aportando siempre una solución en vez de solo un problema, creer en las posibilidades de las personas antes que en sus limitaciones, y creer que juntos se logra más que en solitario.</p>' +
    '<h3>¿Qué es el comportamiento Lean?</h3>' +
    '<p>El comportamiento Lean tiene dos caras que se refuerzan mutuamente. Por un lado, la <strong>mejora continua</strong>: significa "ir a ver" (Gemba) por uno mismo para entender bien la situación, discutir en el propio terreno de trabajo, frente a la situación real y con las personas realmente implicadas — no en el despacho del gestor —, confiar en que ajustes pequeños y concretos pueden marcar una gran diferencia, y hacer que aprender forme parte de la rutina diaria. Por otro lado, un espíritu <strong>excitante y abierto</strong>: "simplemente hazlo", usar la técnica de los 5 Porqués, ver cada problema como una oportunidad de mejora, disfrutar de los momentos "¡ajá!" de comprensión súbita, y mantener un diálogo abierto entre los distintos niveles del personal.</p>' +
    '<h3>Transformación Lean y gestión del cambio: el Valle de la Desesperación</h3>' +
    '<p>Al iniciar una transformación Lean IT, las expectativas de la gente suben deprisa con los primeros resultados… hasta que llegan las primeras experiencias y decepciones, y "la realidad se impone": empiezan las discusiones sobre el dinero invertido y las dudas informales sobre si Lean IT fue la decisión correcta, y las expectativas caen. A ese mínimo se le llama el <strong>Valle de la Desesperación</strong>: el momento en que la gente se desanima al no ver cumplidas sus expectativas de éxito inmediato. Con perseverancia, la realidad vuelve a acercarse a las expectativas y el proyecto acaba madurando.</p>' +
    '<h3>El cambio de paradigma</h3>' +
    '<table style="width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;">' +
      '<tr style="border-bottom:1px solid var(--rule);"><th style="text-align:left;padding:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);">TRADICIONAL</th><th style="text-align:left;padding:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);">LEAN</th></tr>' +
      '<tr style="border-bottom:1px solid var(--rule);"><td style="padding:6px;">Los gestores tienen todas las respuestas</td><td style="padding:6px;">El gestor hace las preguntas correctas; el equipo tiene las respuestas</td></tr>' +
      '<tr style="border-bottom:1px solid var(--rule);"><td style="padding:6px;">Los gestores piensan, los trabajadores ejecutan</td><td style="padding:6px;">Los gestores facilitan que los trabajadores añadan valor</td></tr>' +
      '<tr style="border-bottom:1px solid var(--rule);"><td style="padding:6px;">Las actividades se hacen porque se ordenan</td><td style="padding:6px;">Las actividades solo se hacen si añaden valor</td></tr>' +
      '<tr><td style="padding:6px;">Cierta tasa de defectos es inevitable</td><td style="padding:6px;">Los defectos se pueden eliminar</td></tr>' +
    '</table>' +
    '<h3>Motivación (Daniel H. Pink)</h3>' +
    '<p>Según Daniel H. Pink, la alta motivación descansa en tres elementos. La <strong>autonomía</strong> es sentir la propiedad del trabajo, es decir, poder controlar la tarea, el tiempo, la técnica y el equipo con el que se trabaja. La <strong>maestría</strong> es el compromiso y el estado de flujo, esa conexión entre "lo que hago" y "lo que sé hacer" — un camino difícil y asintótico, al que nunca se llega del todo. Y el <strong>propósito</strong> es la necesidad de entender que el propio trabajo marca una diferencia real.</p>' +
    '<h3>El liderazgo de Chairman Cho de Toyota</h3>' +
    '<p>El presidente Cho resumió su forma de entender el liderazgo Lean en tres ideas. <strong>Ir a ver</strong> (Go See): observar de primera mano, porque "la alta dirección debe pasar tiempo en la planta". <strong>Preguntar por qué</strong> (Ask Why): interactuar de verdad, usando la técnica del ¿por qué? a diario. Y <strong>mostrar respeto</strong> (Show Respect): escuchar, porque, en sus palabras, hay que "respetar a la gente".</p>' +
    '<div class="quote">"Muchas buenas empresas intentan practicar Kaizen y usar diversas herramientas del TPS. Pero lo importante es tener todos los elementos juntos como un sistema. Debe practicarse cada día de forma muy consistente — no a rachas — de manera concreta en el propio terreno de trabajo."<cite>Fujio Cho, presidente del Consejo, Toyota</cite></div>',
  flashcards:[
    {t:'Actitud vs Comportamiento', d:'Actitud = cómo abordo la situación (interno). Comportamiento = cómo reacciono (externo, observable).'},
    {t:'Valle de la Desesperación', d:'Fase de una transformación Lean en la que las expectativas caen al no cumplirse de inmediato, tras el entusiasmo inicial y antes de la mejora sostenida.'},
    {t:'Motivación — Autonomía', d:'Sentir la propiedad del trabajo: control sobre tarea, tiempo, técnica y equipo.'},
    {t:'Motivación — Maestría', d:'Compromiso y flujo; conectar "lo que hago" con "lo que sé hacer". Es un camino asintótico, nunca se completa del todo.'},
    {t:'Motivación — Propósito', d:'Las personas necesitan entender que su trabajo marca una diferencia.'},
    {t:'Chairman Cho de Toyota', d:'"Go see, ask why, show respect" — ir a ver, preguntar por qué, mostrar respeto.'},
    {t:'Paradigma Lean vs tradicional', d:'Lean: el gestor facilita y hace preguntas, los defectos se pueden eliminar. Tradicional: el gestor tiene todas las respuestas, los defectos son inevitables.'},
    {t:'Gemba ("ir a ver")', d:'Ir al lugar real de trabajo para entender la situación de primera mano, en vez de discutir en el despacho del gestor.'}
  ]
},
{
  id:'ps', code:'PS', name:'Kaizen y resolución de problemas',
  theory: '' +
    '<h3>Kaizen: mejora continua — ¿por qué?</h3>' +
    '<p>Practicar Kaizen de forma sistemática persigue varios fines a la vez: entregar mejor calidad de servicio, entregar valor más rápido, aumentar la rentabilidad, retener al mejor talento y dejar una huella ambiental más saludable. No es una técnica aislada, sino una manera de mantener viva la mejora en el tiempo.</p>' +
    '<h3>El evento Kaizen</h3>' +
    '<p>Un evento Kaizen es un evento de bajo coste, con un grupo multifuncional de entre 3 y 7 personas, enfocado en un problema concreto a resolver o en una oportunidad concreta a aprovechar. Se justifica organizar uno cuando se cumplen tres condiciones a la vez: existe una <strong>brecha</strong> real entre el desempeño actual y el deseado, la <strong>causa raíz</strong> del problema no se entiende con claridad, y la <strong>solución no está predeterminada</strong> ni resulta obvia cuál sería la óptima. Para elegir el tema de un Kaizen se valoran tres criterios — los resultados que aporta al cliente o al negocio, su viabilidad y su impacto organizativo —, priorizando siempre aquello que combina alta viabilidad con alto impacto.</p>' +
    '<h4>Roles en un evento Kaizen</h4>' +
    '<p>En todo evento Kaizen participan tres roles: el <strong>patrocinador de dirección</strong> (sponsor), que respalda el evento desde arriba; el <strong>líder Kaizen</strong>, que lo conduce; y los <strong>miembros del equipo Kaizen</strong>, que aportan el conocimiento del día a día.</p>' +
    '<h3>El ciclo de mejora DMAIC</h3>' +
    '<p>DMAIC es el ciclo que estructura cualquier trabajo de mejora, y consta de cinco fases encadenadas.</p>' +
    '<p><strong>Define (Definir)</strong> consiste en definir el problema y fijar el objetivo, acordando el alcance, las metas y los objetivos financieros o de desempeño del Kaizen. De esta fase salen el charter Kaizen completo, la documentación del impacto al cliente, un mapa del proceso afectado (el SIPOC) y las reglas de funcionamiento del equipo. El error más habitual aquí es entrar en demasiado detalle en el mapa de proceso — basta con cubrir en torno al 80% de los casos — o dejar un alcance demasiado amplio, algo que se corrige apoyándose en datos, en un SIPOC refinado y en un Pareto que ayude a priorizar la causa mayor.</p>' +
    '<p><strong>Measure (Medir)</strong> busca entender a fondo el estado actual del proceso y recoger datos fiables de velocidad, calidad y coste. El resultado principal es el VSM, junto con una actualización del charter — y, aunque pueda parecer contraintuitivo, es precisamente en esta fase (y no en Improve) donde suelen surgir ya las primeras <strong>mejoras rápidas ("quick wins")</strong>, aprovechando lo que se va descubriendo mientras se recogen los datos. Los errores típicos son recoger demasiados datos, algo que se evita usando el diagrama causa-efecto para saber qué medir de verdad, o usar un sistema de medición que no es válido, lo que exige estudiar bien el proceso para diseñar un plan de recogida de datos representativo.</p>' +
    '<p><strong>Analyze (Analizar)</strong> sirve para identificar y verificar las causas que afectan a las variables clave de entrada y salida ligadas a los objetivos del Kaizen, y para plantear hipótesis sobre esas causas. De aquí salen una lista de oportunidades de mejora, un análisis del antes y el después, la identificación y priorización de las causas raíz, y una nueva actualización del charter. Los errores más frecuentes son no verificar los supuestos con distintos interesados y sacar conclusiones precipitadas, algo que se evita apoyando siempre el análisis en herramientas gráficas apropiadas.</p>' +
    '<p><strong>Improve (Mejorar)</strong> consiste en desarrollar ideas, probar soluciones, estandarizarlas y medir los resultados, aprendiendo de los pilotos de las soluciones seleccionadas antes de ejecutar la implementación a gran escala. El resultado incluye la evaluación, selección y optimización de la solución, la ejecución de un piloto, un plan de implementación completo, el proceso ya mejorado y el charter actualizado. Aquí el error habitual es imponer una solución preferida en lugar de usar una técnica de decisión estructurada que todo el equipo pueda respaldar, o subestimar el impacto del cambio en las personas, por lo que conviene comunicar bien la solución a todos los interesados.</p>' +
    '<p><strong>Control</strong> cierra el ciclo: controla la implementación para asegurar su sostenibilidad y estabilidad, comparte las lecciones aprendidas e inicia la siguiente iteración. El objetivo final es cerrar el trabajo Kaizen y entregar el proceso mejorado a su propietario, con procedimientos claros para mantener las ganancias conseguidas — apoyándose, si hace falta, en mecanismos a prueba de errores como el <span class="term">Poka-yoke</span>. Los errores más comunes son terminar demasiado pronto, sin definir herramientas de monitorización y acciones de seguimiento, o desaprovechar los beneficios al no considerar replicar y estandarizar la mejora mediante un SOP.</p>' +
    '<h3>El método A3</h3>' +
    '<p>¿Es literalmente una hoja de papel? Sí… y no. El A3 resume la definición del problema, el alcance, las causas raíz, las contramedidas y los resultados, pero lo importante no es el formato exacto sino lo que obliga a hacer: centrarse en la <strong>causa raíz</strong> en lugar de saltar directamente a soluciones basadas en los síntomas. Un A3 completo suele recoger la declaración del problema (¿cuál es el problema que está causando problemas?), los antecedentes (¿por qué se decidió trabajar en él? ¿cuál es el problema de negocio?), la situación actual con datos y visuales analizados, los objetivos o metas (¿cuál es el estado deseado?), el análisis de causa raíz (¿cuáles son las causas subyacentes?), las contramedidas (¿cómo se llegará al estado meta?), el plan de implementación (¿cuándo se implementarán?) y, por último, el seguimiento (¿qué resultados dio el despliegue de las contramedidas?).</p>' +
    '<h3>Herramientas Kaizen</h3>' +
    '<p>Tres herramientas aparecen una y otra vez en cualquier trabajo Kaizen. El <strong>diagrama de Pareto</strong> ordena las causas de un problema de mayor a menor contribución, siguiendo la regla 80/20, y se usa sobre todo en la fase Measure. El <strong>diagrama de Ishikawa</strong>, o espina de pescado, organiza las posibles causas por categorías — sistema, personas, proceso, política — para ir "perforando" hasta llegar a la causa raíz, y es propio de la fase Analyze. Y la técnica de los <strong>5 Porqués</strong> consiste en preguntar "¿por qué?" repetidamente hasta llegar a esa causa raíz; suele combinarse precisamente con el Ishikawa.</p>' +
    '<h3>Cómo prepararse para el examen Lean IT Foundation</h3>' +

function moduleDot(id){
  var qs = byModule[id], answered = 0, wrong = 0;
  qs.forEach(function(q){
    var a = state.answers[q.id];
    if(a !== undefined){ answered++; if(a !== q.c) wrong++; }
  });
  if(answered === 0) return '';
  if(answered < qs.length) return 'some';
  return wrong > 0 ? 'done wrong' : 'done';
}

      '<span class="label">' + m.name + '</span>' +
      '<span class="dot ' + dot + '"></span>' +

  });
