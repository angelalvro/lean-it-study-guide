  });
  html += '<div class="rail-divider"></div><div class="rail-heading">Resumen</div>' +
    '<button class="rail-item' + (state.view === 'summary' ? ' active' : '') + '" data-view="summary">' +
      '<span class="code">RS</span><span class="label">Tablas rápidas (5S, DMAIC)</span><span class="dot"></span>' +
    '</button>';
  rail.innerHTML = html;
  var examIds = EXAMS.map(function(ex){ return ex.id; });
  Array.prototype.forEach.call(rail.querySelectorAll('.rail-item'), function(btn){
    btn.addEventListener('click', function(){
      state.view = btn.getAttribute('data-view');
      if(examIds.indexOf(state.view) === -1) state.sub = 'theory';
      renderAll();
    });
  });
}

/* ============== RENDER: MODULE PANEL ============== */
function renderModulePanel(mod){
  var panel = document.getElementById('panel');
  var qs = byModule[mod.id];
  var subtabs = [
    {id:'theory', label:'Teoría'},
    {id:'cards', label:'Conceptos clave (' + mod.flashcards.length + ')'},
    {id:'quiz', label:'Práctica (' + qs.length + ' preguntas)'}
  ];
  var html = '<div class="panel-head"><h2>' + mod.code + ' — ' + mod.name + '</h2>' +
    '<span class="sub">' + qs.length + ' preguntas del examen de muestra pertenecen a este módulo</span></div>';
  html += '<div class="subtabs">';
  subtabs.forEach(function(t){
    html += '<button class="subtab' + (state.sub === t.id ? ' active' : '') + '" data-sub="' + t.id + '">' + t.label + '</button>';
  });
  html += '</div><div class="panel-body" id="panel-body"></div>';
  panel.innerHTML = html;

  Array.prototype.forEach.call(panel.querySelectorAll('.subtab'), function(btn){
    btn.addEventListener('click', function(){
      state.sub = btn.getAttribute('data-sub');
      renderAll();
    });
  });

  var body = document.getElementById('panel-body');
  if(state.sub === 'theory'){
    body.innerHTML = '<div class="theory">' + mod.theory + '</div>';
  } else if(state.sub === 'cards'){
    var cardsHtml = '<div class="cardgrid">';
    mod.flashcards.forEach(function(c, i){
      cardsHtml += '<div class="fc" tabindex="0" role="button" aria-label="Tarjeta: ' + c.t + '. Pulsa para ver la definición.">' +
        '<div class="fc-inner">' +
          '<div class="fc-face fc-front"><div class="fc-term">' + c.t + '</div><div class="fc-hint">Toca para ver la definición</div></div>' +
          '<div class="fc-face fc-back"><p>' + c.d + '</p></div>' +
        '</div></div>';
    });
    cardsHtml += '</div>';
    body.innerHTML = cardsHtml;
    Array.prototype.forEach.call(body.querySelectorAll('.fc'), function(el){
      function toggle(){ el.classList.toggle('flipped'); }
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(); } });
    });
  } else if(state.sub === 'quiz'){
    renderQuiz(body, qs);
  }
}

function renderQuiz(body, qs){
  var answeredCount = 0;
  qs.forEach(function(q){ if(state.answers[q.id] !== undefined) answeredCount++; });
  var html = '<div class="qcount">Progreso: ' + answeredCount + ' / ' + qs.length + ' respondidas</div>';
  qs.forEach(function(q, idx){
    html += renderQuestionCard(q, idx + 1, state.answers[q.id]);
  });
  body.innerHTML = html;
  wireQuestionCards(body, qs, 'answers');
}

var LETTERS = ['a','b','c','d'];

function renderQuestionCard(q, num, picked){
  var answered = picked !== undefined;
  var cls = 'qcard' + (answered ? (picked === q.c ? ' answered correct' : ' answered wrong') : '');
  var html = '<div class="' + cls + '" data-qid="' + q.id + '">' +
    '<div class="qnum">Pregunta ' + num + '</div>' +
    '<div class="qtext">' + q.q + '</div>' +
    '<div class="opts">';
  q.o.forEach(function(opt, i){
    var optCls = 'opt';
    if(answered){
      if(i === q.c) optCls += ' right';
      else if(i === picked) optCls += ' chosen-wrong';
    }
    html += '<button class="' + optCls + '" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
      '<span class="letter">' + LETTERS[i] + '</span><span>' + opt + '</span></button>';
  });
  html += '</div>';
  html += '<div class="explain' + (answered ? ' show' : '') + '">' +
    '<span class="verdict ' + (answered ? (picked === q.c ? 'ok' : 'no') : '') + '">' + (answered ? (picked === q.c ? 'CORRECTO' : 'INCORRECTO') : '') + '</span>' +
    '<b>Explicación</b>' + q.e +
  '</div></div>';
  return html;
}

function wireQuestionCards(container, qs, bucket, examId){
  Array.prototype.forEach.call(container.querySelectorAll('.qcard'), function(card){
    var qid = parseInt(card.getAttribute('data-qid'), 10);
    Array.prototype.forEach.call(card.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-i'), 10);
        if(examId){ state.exams[examId].answers[qid] = i; } else { state[bucket][qid] = i; }
        renderAll();
      });
    });
  });
}

/* ============== RENDER: EXAM (simulacro) ============== */
var SYLLABUS_NAMES = {in:'Introducción a Lean', cu:'El Cliente', pr:'El Proceso', pe:'Rendimiento', or:'Organización', ba:'Comportamiento y Actitud', ps:'Kaizen / Resolución de problemas'};

function examScore(ex){
  var st = state.exams[ex.id], correct = 0;
  ex.questions.forEach(function(q){ if(st.answers[q.id] === q.c) correct++; });
  return correct;
}
function examPassMark(ex){ return Math.round(ex.questions.length * 0.65); }
function examPass(ex){ return examScore(ex) >= examPassMark(ex); }

function renderExamPanel(ex){
  var panel = document.getElementById('panel');
  var st = state.exams[ex.id];
  var total = ex.questions.length;
  var answered = Object.keys(st.answers).length;
  var html = '<div class="panel-head"><h2>' + ex.label + ' — ' + total + ' preguntas</h2>' +
    '<span class="sub">' + ex.sub + ' · aprobado ≥ ' + examPassMark(ex) + '/' + total + ' (65%)</span></div>' +
    '<div class="panel-body" id="panel-body"></div>';
  panel.innerHTML = html;
  var body = document.getElementById('panel-body');

  if(st.done){
    body.innerHTML = renderResults(ex) + renderExamQuestions(ex);
    wireQuestionCards(body, ex.questions, null, ex.id);
    var retry = document.getElementById('btn-retry');
    if(retry) retry.addEventListener('click', function(){
      state.exams[ex.id] = { answers:{}, done:false }; renderAll(); window.scrollTo({top:0, behavior:'smooth'});
    });
    return;
  }

  var html2 = '<div class="qcount">Progreso: ' + answered + ' / ' + total + ' respondidas — la corrección y las explicaciones aparecerán al pulsar "Corregir simulacro".</div>';
  ex.questions.forEach(function(q, idx){
    html2 += renderExamQuestionUnanswered(ex, q, idx + 1);
  });
  html2 += '<div class="examfoot">' +
    '<span class="progresstext">' + answered + ' / ' + total + ' respondidas</span>' +
    '<button class="btn btn-primary" id="btn-correct"' + (answered < total ? ' disabled' : '') + '>Corregir simulacro</button>' +
  '</div>';
  body.innerHTML = html2;

  Array.prototype.forEach.call(body.querySelectorAll('.qcard'), function(card){
    var qid = parseInt(card.getAttribute('data-qid'), 10);
    Array.prototype.forEach.call(card.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-i'), 10);
        state.exams[ex.id].answers[qid] = i;
        renderAll();
      });
    });
  });
  var correctBtn = document.getElementById('btn-correct');
  if(correctBtn) correctBtn.addEventListener('click', function(){
    state.exams[ex.id].done = true; renderAll(); window.scrollTo({top:0, behavior:'smooth'});
  });
}

function renderExamQuestionUnanswered(ex, q, num){
  var picked = state.exams[ex.id].answers[q.id];
  var html = '<div class="qcard" data-qid="' + q.id + '">' +
    '<div class="qnum">Pregunta ' + num + ' · ' + q.m.toUpperCase() + '</div>' +
    '<div class="qtext">' + q.q + '</div><div class="opts">';
  q.o.forEach(function(opt, i){
    var cls = 'opt' + (picked === i ? ' pick' : '');
    html += '<button class="' + cls + '" data-i="' + i + '"><span class="letter">' + LETTERS[i] + '</span><span>' + opt + '</span></button>';
  });
  html += '</div></div>';
  return html;
}

function renderExamQuestions(ex){
  var st = state.exams[ex.id];
  var html = '<h3 style="font-family:var(--font-display);font-size:16px;margin:26px 0 12px;">Revisión pregunta por pregunta</h3>';
  ex.questions.forEach(function(q, idx){
    html += renderQuestionCard(q, idx + 1, st.answers[q.id]);
  });
  return html;
}

function renderResults(ex){
  var st = state.exams[ex.id];
  var total = ex.questions.length;
  var score = examScore(ex);
  var passMark = examPassMark(ex);
  var pass = examPass(ex);
  var breakdown = {};
  MODULES.forEach(function(m){ breakdown[m.id] = {correct:0, total:0}; });
  ex.questions.forEach(function(q){
    breakdown[q.m].total++;
    if(st.answers[q.id] === q.c) breakdown[q.m].correct++;
  });
  var html = '<div class="resultbar ' + (pass ? 'pass' : 'fail') + '">' +
    '<div class="score">' + score + ' <span style="font-size:16px;color:var(--ink-soft);">/ ' + total + '</span></div>' +
    '<span class="pill ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'Aprobado' : 'No aprobado') + '</span>' +
    '<span style="font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);">Umbral para aprobar: ' + passMark + ' / ' + total + ' (65%)</span>' +
    '<span style="flex:1;"></span>' +
    '<button class="btn btn-ghost" id="btn-retry">Repetir simulacro</button>' +
  '</div>';
  html += '<div class="tablewrap"><table class="breakdown">' +
    '<caption>Desglose por área del temario</caption>' +
    '<thead><tr><th>Código</th><th>Área</th><th class="num">Puntuación</th><th class="num">Preguntas</th></tr></thead><tbody>';
  MODULES.forEach(function(m){
    var b = breakdown[m.id];
    html += '<tr><td class="code">' + m.code + '</td><td>' + m.name + '</td>' +
      '<td class="num">' + b.correct + '</td><td class="num">' + b.total + '</td></tr>';
  });
  html += '<tr><td></td><td style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);">Total</td>' +
    '<td class="num" style="font-weight:700;">' + score + '</td><td class="num" style="font-weight:700;">' + total + '</td></tr>';
  html += '</tbody></table></div>';
  return html;
}

/* ============== RENDER: SUMMARY (tablas rápidas) ============== */
function renderSummaryPanel(){
  var panel = document.getElementById('panel');
  var html = '<div class="panel-head"><h2>Resumen — Tablas rápidas</h2>' +
    '<span class="sub">5S y DMAIC de un vistazo, para repasar justo antes del examen</span></div>' +
    '<div class="panel-body"><div class="theory">';

  html += '<h3>Las 5S</h3>' +
    '<p>Nombre en inglés (el que suele aparecer en el examen), término japonés de origen entre paréntesis, y qué significa en la práctica.</p>' +
    '<table class="reftable"><thead><tr><th>Inglés</th><th>Japonés</th><th>Qué es</th></tr></thead><tbody>' +
      '<tr><td class="term">Sort</td><td>Seiri</td><td>Clasificar: eliminar herramientas, piezas e instrucciones innecesarias y quedarse solo con lo esencial, accesible.</td></tr>' +
      '<tr><td class="term">Set in Order</td><td>Seiton</td><td>Ordenar: un lugar para cada cosa, y cada cosa en su lugar, claramente indicado.</td></tr>' +
      '<tr><td class="term">Shine</td><td>Seiso</td><td>Limpiar: dejar limpios el puesto de trabajo y el equipo al final de cada turno.</td></tr>' +
      '<tr><td class="term">Standardize</td><td>Seiketsu</td><td>Estandarizar: las prácticas de trabajo son consistentes, con las mismas herramientas y procedimientos en cada puesto.</td></tr>' +
      '<tr><td class="term">Sustain</td><td>Shitsuke</td><td>Mantener: revisar los estándares y convertirlos en hábito, para seguir mejorando.</td></tr>' +
    '</tbody></table>' +

    '<h3>El ciclo DMAIC</h3>' +
    '<p>Qué se hace en cada fase y qué herramientas se usan típicamente en ella — la trampa más habitual del examen es situar una herramienta o una tarea en la fase equivocada.</p>' +
    '<table class="reftable"><thead><tr><th>Sigla</th><th>Qué se hace</th><th>Herramientas típicas</th></tr></thead><tbody>' +
      '<tr><td class="term">D — Define</td><td>Definir el problema, el alcance y el objetivo del Kaizen.</td><td>SIPOC, charter Kaizen</td></tr>' +
      '<tr><td class="term">M — Measure</td><td>Entender el estado actual del proceso y recoger datos fiables. Aquí suelen surgir ya las primeras mejoras rápidas (quick wins).</td><td>Value Stream Map (VSM), diagrama de Pareto</td></tr>' +
      '<tr><td class="term">A — Analyze</td><td>Identificar y verificar las causas raíz del problema.</td><td>Diagrama de Ishikawa (espina de pescado), técnica de los 5 Porqués</td></tr>' +
      '<tr><td class="term">I — Improve</td><td>Desarrollar, pilotar e implementar las soluciones seleccionadas.</td><td>Técnica de decisión estructurada, pilotos de la solución</td></tr>' +
      '<tr><td class="term">C — Control</td><td>Asegurar que la mejora se sostiene en el tiempo y compartir lo aprendido.</td><td>Standard Operating Procedure (SOP), Poka-yoke</td></tr>' +
    '</tbody></table>' +
    '</div></div>';

  panel.innerHTML = html;
}

/* ============== MAIN RENDER ============== */
function renderAll(){
  renderRail();
  if(state.view === 'summary'){ renderSummaryPanel(); return; }
  var ex = findExam(state.view);
  if(ex){ renderExamPanel(ex); }
  else {
    var mod = MODULES.filter(function(m){ return m.id === state.view; })[0];
    renderModulePanel(mod);
  }
}

renderAll();
})();
</script>
